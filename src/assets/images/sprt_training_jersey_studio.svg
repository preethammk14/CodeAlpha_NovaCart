  <rect width="800" height="600" fill="url(#studioBg)"/>
  <rect y="430" width="800" height="170" fill="url(#floorGrad)"/>
  
    <ellipse cx="400" cy="472" rx="190" ry="20" fill="#141416" opacity="0.16" filter="url(#castShadow)"/>
    <g filter="url(#softShadow)">
      <!-- Athletic breathable micro-mesh jersey silhouette -->
      <path d="M275 135 L345 120 C370 152 430 152 455 120 L525 135 L625 225 L568 282 L525 245 L525 462 L275 462 L275 245 L232 282 L175 225 Z" fill="#1C1D22"/>
      <!-- Dynamic burnt orange shoulder raglan stripes -->
      <path d="M275 135 L205 198 L220 214 L295 148 Z" fill="#F97316"/>
      <path d="M525 135 L595 198 L580 214 L505 148 Z" fill="#F97316"/>
      <!-- Breathable mesh texture accent -->
      <path d="M345 120 C370 156 430 156 455 120" fill="none" stroke="#F97316" stroke-width="5"/>
      <polygon points="445,215 470,215 457,238" fill="#F97316"/>
    </g>
  
</svg>