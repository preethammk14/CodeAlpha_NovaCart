      <rect x="410" y="295" width="155" height="36" rx="18" fill="url(#teakWood)"/>
      <rect x="422" y="331" width="131" height="65" rx="6" fill="#E6DEC8"/>
      <line x1="429" y1="331" x2="429" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="438" y1="331" x2="438" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="447" y1="331" x2="447" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="456" y1="331" x2="456" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="465" y1="331" x2="465" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="474" y1="331" x2="474" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="483" y1="331" x2="483" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="492" y1="331" x2="492" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="501" y1="331" x2="501" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="510" y1="331" x2="510" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="519" y1="331" x2="519" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="528" y1="331" x2="528" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="537" y1="331" x2="537" y2="396" stroke="#C5B99B" stroke-width="2"/><line x1="546" y1="331" x2="546" y2="396" stroke="#C5B99B" stroke-width="2"/>
      <!-- Folded waffle microfiber cloths -->
      <rect x="405" y="408" width="175" height="44" rx="10" fill="#D9D3C7"/>
      <rect x="415" y="394" width="155" height="22" rx="8" fill="#EFEAE0"/>
