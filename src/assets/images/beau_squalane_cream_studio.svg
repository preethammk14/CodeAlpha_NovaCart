  <rect width="800" height="600" fill="url(#studioBg)"/>
  <rect y="430" width="800" height="170" fill="url(#floorGrad)"/>
  
    <ellipse cx="400" cy="462" rx="165" ry="20" fill="#141416" opacity="0.16" filter="url(#castShadow)"/>
    <g filter="url(#softShadow)">
      <rect x="265" y="255" width="270" height="186" rx="34" fill="url(#matteCream)" stroke="#E0D8CA" stroke-width="2"/>
      <rect x="275" y="210" width="250" height="62" rx="18" fill="url(#teakWood)"/>
      <rect x="275" y="252" width="250" height="14" fill="#6F3F1B" opacity="0.25"/>
      <rect x="315" y="310" width="170" height="84" rx="8" fill="#FFFFFF" opacity="0.88"/>
      <line x1="345" y1="342" x2="455" y2="342" stroke="#141416" stroke-width="3" opacity="0.7"/>
      <line x1="365" y1="362" x2="435" y2="362" stroke="#F97316" stroke-width="3"/>
    </g>
  
