<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#ECE6DC"/>
    </radialGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1ECE4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E2DAD0" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="castShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#141416" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="35%" stop-color="#C8C9CE"/>
      <stop offset="70%" stop-color="#8B8D94"/>
      <stop offset="100%" stop-color="#E2E3E8"/>
    </linearGradient>
    <linearGradient id="darkCharcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35363B"/>
      <stop offset="50%" stop-color="#1E1E22"/>
      <stop offset="100%" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="warmBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9C77B"/>
      <stop offset="48%" stop-color="#C59843"/>
      <stop offset="100%" stop-color="#8E6723"/>
    </linearGradient>
    <linearGradient id="cognacLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A65E32"/>
      <stop offset="50%" stop-color="#834420"/>
      <stop offset="100%" stop-color="#5B2D12"/>
    </linearGradient>
    <linearGradient id="teakWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B97B45"/>
      <stop offset="35%" stop-color="#9A5D2E"/>
      <stop offset="70%" stop-color="#814B22"/>
      <stop offset="100%" stop-color="#A66A38"/>
    </linearGradient>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97A28" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#9A4812" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#592607"/>
    </linearGradient>
    <linearGradient id="matteCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2ECE2"/>
      <stop offset="100%" stop-color="#DFD7CA"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#studioBg)"/>
  <rect y="430" width="800" height="170" fill="url(#floorGrad)"/>
  
    <ellipse cx="400" cy="466" rx="240" ry="22" fill="#141416" opacity="0.18" filter="url(#castShadow)"/>
    <g filter="url(#softShadow)">
      <!-- Large compression cube -->
      <rect x="175" y="185" width="290" height="245" rx="22" fill="url(#darkCharcoal)"/>
      <rect x="196" y="210" width="248" height="170" rx="14" fill="#3B3D44" stroke="#575962" stroke-width="2" stroke-dasharray="4 4"/>
      <!-- Medium orange compression cube -->
      <rect x="360" y="245" width="240" height="185" rx="20" fill="url(#orangeAccent)"/>
      <rect x="378" y="268" width="204" height="122" rx="12" fill="#EA580C" stroke="#FDBA74" stroke-width="2" stroke-dasharray="4 4"/>
      <!-- Universal GaN travel power adapter -->
      <rect x="520" y="340" width="95" height="105" rx="14" fill="url(#matteCream)" stroke="#D4CCC0" stroke-width="2"/>
      <circle cx="552" cy="382" r="8" fill="#141416"/>
      <circle cx="584" cy="382" r="8" fill="#141416"/>
      <rect x="556" y="408" width="24" height="8" rx="4" fill="#F97316"/>
    </g>
  
</svg>